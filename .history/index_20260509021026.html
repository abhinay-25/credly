<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credly Badge - Enter Your Name</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container">
        <div class="header-content">
          <div class="logo-section">
            <a href="#" class="logo">
              <span class="logo-text">Credly</span>
            </a>
            <span class="logo-subtitle">by Pearson</span>
          </div>
          <nav class="nav">
            <button class="nav-icon" aria-label="Search">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/>
              </svg>
            </button>
            <button class="nav-icon" aria-label="Menu">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/>
              </svg>
            </button>
          </nav>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content entry-page">
      <div class="container">
        <div class="entry-card">
          <h1 class="entry-title">Enter Your Name</h1>
          <p class="entry-subtitle">
            View your Cisco Junior Cybersecurity Analyst Career Path badge
          </p>

          <form class="entry-form" id="nameForm">
            <div class="form-group">
              <label for="nameInput" class="form-label">Your Name</label>
              <input
                type="text"
                id="nameInput"
                class="form-input"
                placeholder="Enter your full name"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary btn-large">
              View Badge
            </button>
          </form>

          <p class="entry-note">
            Or use a pre-filled name: <strong>Suhaas Bandari</strong>
          </p>
          <button class="btn btn-secondary" onclick="setDefaultName()">
            Load Default Example
          </button>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <div class="footer-links">
          <a href="#" class="footer-link">Request Demo</a>
          <a href="#" class="footer-link">About Credly</a>
          <a href="#" class="footer-link">Terms</a>
          <a href="#" class="footer-link">Privacy</a>
          <a href="#" class="footer-link">Developers</a>
          <a href="#" class="footer-link">Support</a>
          <a href="#" class="footer-link">Cookies</a>
          <a href="#" class="footer-link"
            >Do Not Sell My Personal Information</a
          >
        </div>
      </div>
    </footer>

    <script>
      document
        .getElementById("nameForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const name = document.getElementById("nameInput").value.trim();
          if (name) {
            // Redirect to badge page with name as URL parameter
            window.location.href =
              "badge.html?name=" + encodeURIComponent(name);
          }
        });

      function setDefaultName() {
        // Redirect to badge page with default name as URL parameter
        window.location.href = "badge.html?name=Suhaas%20Bandari";
      }
    </script>
  </body>
</html>
